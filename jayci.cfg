# source 'em up
#===============================================================
# 2026-11-09: moved up here so jayci_announce exists before it's used below,
# and looped so EVERY file loads. (`. a.sh b.sh` only sources a.sh -- that's
# why jaylias / jaygit_* from jayhere.sh were never defined.) Old lines in FOSSIL RECORD.
for f in "${JAY_SPACE}"/jayci/scripts/*.sh "${JAY_SPACE}"/jayci/configs/*.cfg; do
    [ -f "$f" ] && . "$f"
done
#===============================================================


#===============================================================
# from .jayrc -->
#                   ----> source jaycody/<project>.cfg
echo ""
jayci_announce "jayci.cfg ----> $ source ./scripts/*.sh"
echo "-----------------------------------------------------------------"
l ${JAY_SPACE}/jayci/scripts/
echo ""
# echo "jayci.cfg ----> $ source ./configs/*.cfg"
jayci_announce "jayci.cfg ----> $ source ./configs/*.cfg"
echo "-----------------------------------------------------------------"
l ${JAY_SPACE}/jayci/configs/
#===============================================================


# list project-specific functions
# 2026-11-09: moved to the end of .jayrc, after every project .cfg loads. See FOSSIL RECORD.



